<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <include>/usr/share/dbus-1/session.conf</include>
  <!-- Notification surfaces belong to the desktop, outside app compartments.
       Do not activate a second daemon on a restricted compositor connection. -->
  <policy context="default">
    <deny send_destination="org.freedesktop.Notifications"/>
    <deny send_destination="org.xfce.Notifyd"/>
  </policy>
</busconfig>
