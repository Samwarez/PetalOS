#!/usr/sbin/nft -f
flush ruleset

table inet portable_vpn {
    # Empty at boot/disconnect. The profile manager replaces these atomically.
    set endpoints4 {
        type ipv4_addr . inet_service
    }
    set endpoints6 {
        type ipv6_addr . inet_service
    }
    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept
        iifname "wg0" accept

        # DHCP replies for the physical IPv4 connection.
        meta nfproto ipv4 udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;

        # Network applications cannot open new connections to host services.
        # Established replies still allow the root-owned SAB management bridge.
        oifname "lo" meta skuid { 940, 942, 943, 944, 945 } ct state new drop
        # Encapsulation can retain the inner socket UID. Only root-created
        # WireGuard transport may carry mark 51820; its endpoint/port whitelist
        # below still applies. Role processes have no capabilities to set marks.
        meta skuid { 940, 942, 943, 944, 945 } oifname != "wg0" oifname != "lo" meta mark != 51820 drop
        oifname "lo" accept
        oifname "wg0" accept

        # WireGuard's encrypted transport, with its assigned firewall mark.
        ip daddr . udp dport @endpoints4 meta mark 51820 accept
        ip6 daddr . udp dport @endpoints6 meta mark 51820 accept

        # Obtain/renew an IPv4 address on the physical network.
        meta nfproto ipv4 udp sport 68 udp dport 67 accept
    }
}
