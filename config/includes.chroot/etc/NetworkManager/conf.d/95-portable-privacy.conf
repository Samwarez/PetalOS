# Defaults apply to profiles without explicit overrides. Profiles stay in RAM.
# Keep NetworkManager's driver-specific scan-randomization compatibility rules.
[device]
wifi.scan-rand-mac-address=yes

[connection-portable-wired]
match-device=type:ethernet
connection.stable-id=${RANDOM}
ethernet.cloned-mac-address=random
ipv4.dhcp-client-id=mac
ipv4.dhcp-send-hostname=0
ipv6.dhcp-duid=ll
ipv6.dhcp-iaid=mac
ipv6.dhcp-send-hostname=0
ipv6.addr-gen-mode=stable-privacy
ipv6.ip6-privacy=2
connection.llmnr=0
connection.mdns=0

[connection-portable-wifi]
match-device=type:wifi
connection.stable-id=${RANDOM}
wifi.cloned-mac-address=random
ipv4.dhcp-client-id=mac
ipv4.dhcp-send-hostname=0
ipv6.dhcp-duid=ll
ipv6.dhcp-iaid=mac
ipv6.dhcp-send-hostname=0
ipv6.addr-gen-mode=stable-privacy
ipv6.ip6-privacy=2
connection.llmnr=0
connection.mdns=0
