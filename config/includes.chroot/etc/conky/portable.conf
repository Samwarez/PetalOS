conky.config = {
    out_to_x = false,
    out_to_wayland = true,
    alignment = 'bottom_right',
    gap_x = 24,
    gap_y = 65,
    minimum_width = 600,
    maximum_width = 600,
    update_interval = 2,
    double_buffer = true,
    background = false,

    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'PortableStatus',
    own_window_title = 'Portable Status',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    default_color = 'B8BCC8',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_spacer = 'none',
    net_avg_samples = 3,
    text_buffer_size = 16384,
};

conky.text = [[
${alignr}${font DejaVu Sans Mono:bold:size=12}PetalOS${font}
${alignr}${time %Y-%m-%d  %H:%M:%S UTC}
${hr}
${if_existing /sys/class/net/wg0}
${alignr}Download: ${downspeed wg0}   Upload: ${upspeed wg0}
${alignr}Received: ${totaldown wg0}   Sent: ${totalup wg0}
${else}
${alignr}Download: —   Upload: —
${endif}
${execpi 10 /usr/local/bin/portable-status-format}
]];
